<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
    <title>My hobby hub</title>
</head>

<body>

    <!-- <-!-- container-fluid: stretches to fill the full width of the screen  -->
    <div class="container-fluid" bg-primary text-white p-4>
        <h1>my hobby hub</h1>
        <p>A page about the things i love to do!</p>
    </div>

    <!-- <-!-- bg-success: green background, white text  -->
    <div class="bg-warning border border-dark p-3 my-3">
        <h2>drawing</h2>
        <p>i enjoy drawing animals and making my own comic strips</p>
    </div>

    <!-- <-!-- bg-danger: red background, white text -->
    <div class="bg-danger text-white p-3 my-3">
        <h2>sports</h2>
        <p>i play cricket and love going swimming at the weekends</p>
    </div>
    </div>
    <!-- container-fluid footer: full-width dark bar at the bottom-->
    <div class="container-fluid bg-dark text-white p-3">
        <p>made with bootstrap - my hobby hub</p>
    </div>
</body>

</html>
